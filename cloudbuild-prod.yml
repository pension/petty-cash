steps:
  # ---------- API ----------
  - name: gcr.io/cloud-builders/gcloud
    id: SetupEnv-API
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        mkdir -p apps/petty-cash-api/secrets
        gcloud secrets versions access latest --secret="$_API_GLOBAL_SECRET" > apps/petty-cash-api/.env
        echo >> apps/petty-cash-api/.env
        gcloud secrets versions access latest --secret="$_API_ENV_SECRET" >> apps/petty-cash-api/.env
        gcloud secrets versions access latest --secret=global-oauth-public > apps/petty-cash-api/secrets/jwtRS256.key.pub

  - name: gcr.io/cloud-builders/docker
    id: Build-API
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    secretEnv:
      - NPM_TOKEN
    waitFor:
      - SetupEnv-API
    args:
      - '-c'
      - |
        docker build --build-arg=GH_PAT=$$NPM_TOKEN \
          -t $_GCR_HOSTNAME/$PROJECT_ID/$_API_SERVICE_NAME:$COMMIT_SHA \
          -f Dockerfile.api .

  - name: gcr.io/cloud-builders/gcloud
    id: Clean-API
    entrypoint: bash
    waitFor:
      - Build-API
    args:
      - '-c'
      - |
        rm -rf apps/petty-cash-api/.env apps/petty-cash-api/secrets

  # ---------- UI (independent of API build, so it starts in parallel) ----------
  - name: gcr.io/cloud-builders/gcloud
    id: SetupEnv-UI
    entrypoint: bash
    waitFor: ['-']
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud secrets versions access latest --secret="$_API_GLOBAL_SECRET" > apps/petty-cash-ui/.env
        echo >> apps/petty-cash-ui/.env
        gcloud secrets versions access latest --secret="$_UI_ENV_SECRET" >> apps/petty-cash-ui/.env

  - name: gcr.io/cloud-builders/docker
    id: Build-UI
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    secretEnv:
      - NPM_TOKEN
    waitFor:
      - SetupEnv-UI
    args:
      - '-c'
      - |
        docker build --build-arg=GH_PAT=$$NPM_TOKEN \
          -t $_GCR_HOSTNAME/$PROJECT_ID/$_UI_SERVICE_NAME:$COMMIT_SHA \
          -f Dockerfile.ui .

  - name: gcr.io/cloud-builders/gcloud
    id: Clean-UI
    entrypoint: bash
    waitFor:
      - Build-UI
    args:
      - '-c'
      - |
        rm -f apps/petty-cash-ui/.env

  # ---------- Push ----------
  - name: gcr.io/cloud-builders/docker
    id: Push-API
    waitFor:
      - Build-API
    args:
      - push
      - $_GCR_HOSTNAME/$PROJECT_ID/$_API_SERVICE_NAME:$COMMIT_SHA

  - name: gcr.io/cloud-builders/docker
    id: Push-UI
    waitFor:
      - Build-UI
    args:
      - push
      - $_GCR_HOSTNAME/$PROJECT_ID/$_UI_SERVICE_NAME:$COMMIT_SHA

  # ---------- Deploy ----------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy-API
    entrypoint: gcloud
    waitFor:
      - Push-API
    args:
      - run
      - deploy
      - $_API_SERVICE_NAME
      - '--platform=managed'
      - '--service-account=$_SERVICE_ACCOUNT'
      - '--vpc-connector=$_VPC_CONNECTOR'
      - '--set-cloudsql-instances=$_CLOUD_SQL'
      - '--port=4000'
      - '--no-use-http2'
      - '--allow-unauthenticated'
      - '--image=$_GCR_HOSTNAME/$PROJECT_ID/$_API_SERVICE_NAME:$COMMIT_SHA'
      - '--labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID'
      - '--region=$_DEPLOY_REGION'
      - '--quiet'

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy-UI
    entrypoint: gcloud
    waitFor:
      - Push-UI
      - Deploy-API
    args:
      - run
      - deploy
      - $_UI_SERVICE_NAME
      - '--platform=managed'
      - '--service-account=$_SERVICE_ACCOUNT'
      - '--port=3000'
      - '--no-use-http2'
      - '--allow-unauthenticated'
      - '--image=$_GCR_HOSTNAME/$PROJECT_ID/$_UI_SERVICE_NAME:$COMMIT_SHA'
      - '--labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID'
      - '--region=$_DEPLOY_REGION'
      - '--quiet'

timeout: 2400s

# Images must include the tag that was actually built; without a tag Cloud Build
# looks for ":latest", which doesn't exist locally, and fails.
images:
  - $_GCR_HOSTNAME/$PROJECT_ID/$_API_SERVICE_NAME:$COMMIT_SHA
  - $_GCR_HOSTNAME/$PROJECT_ID/$_UI_SERVICE_NAME:$COMMIT_SHA

options:
  substitutionOption: ALLOW_LOOSE

substitutions:
  _UI_ENV_SECRET: mpao-prod-petty-cash-secret-global
  _DEPLOY_REGION: asia-east1
  _VPC_CONNECTOR: red-connector
  _PLATFORM: managed
  _CLOUD_SQL: production-147011:asia-east1:prod-mssql-db
  _API_GLOBAL_SECRET: prod-global-nest-env
  _SERVICE_ACCOUNT: prod-cloudrun@production-147011.iam.gserviceaccount.com
  _UI_SERVICE_NAME: mpao-prod-petty-cash-run-asia-east-1
  _GCR_HOSTNAME: asia.gcr.io
  _API_SERVICE_NAME: mpao-prod-petty-cash-api-run-asia-east-1
  _API_ENV_SECRET: mpao-prod-petty-cash-api-secret-global

tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - petty-cash-api
  - petty-cash-ui

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/npm-env/versions/latest
      env: NPM_TOKEN
